<header class="header-inner">
  <div class="brand">
    <a routerLink="/" class="logo">Bulbapedia</a>
  </div>

  <nav class="nav-menu">
    <a routerLink="/pokemon" routerLinkActive="active" class="nav-link">Pokedex</a>
    <a routerLink="/move" routerLinkActive="active" class="nav-link">Moves</a>
  </nav>

  <form class="global-search" (submit)="onSearchSubmit($event)">
    <div class="search-input-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="search"
        placeholder="Search Pokémon, Moves..."
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        aria-label="Global Search"
      />
    </div>
  </form>
</header>
