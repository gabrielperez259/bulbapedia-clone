@if (isLoading()) {
  <div class="loading-container">
    <p>Carregando sprites do Pokémon...</p>
  </div>
} @else if (error()) {
  <div class="error-container">
    <p>Erro ao carregar os sprites deste Pokémon.</p>
  </div>
} @else {
  <div class="sprites-page-container">
    @if (generationGroups().length > 0) {
      @for (group of generationGroups(); track group.generationTitle) {
        <app-generation-sprites-card [group]="group" />
      }
    } @else {
      <p class="no-sprites">Nenhum sprite disponível para este Pokémon.</p>
    }
  </div>
}
