<div class="ability-container" [transparency]="isTransparent()">
    <span class="ability-title"> ABILITIES </span>
    <div class="abilities-flex">
    @for (ability of abilities(); track $index) {
    
        <button class="ability-button">  
            <a class="ability-link" [routerLink]="['../../ability', ability.ability.name]">
                <span class="ability-name-span"> {{ability.ability.name | cleanText }}</span>    
            </a>    
        </button>
    
    }
    </div> 
</div>
