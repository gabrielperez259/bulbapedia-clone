<div class="container">
  <select
    class="gen-select"
    [value]="selectedGeneration()"
    (change)="onGenChange($event)"
    aria-label="Select Generation"
  >
    @for (gen of genOptions; track gen.genValue) {
      <option [value]="gen.genValue">{{ gen.title }}</option>
    }
  </select>
</div>
