<div class="types-container">
    <div class="type-title-container">
        <span> TYPE </span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        @for(type of types(); track $index ) {
            <button 
                class="type-button" 
                [style.background-color]="type.type.name | capitalizeWords | colorType">
                <span>  {{type.type.name | capitalizeWords}} </span>
            </button>
        }
    </div>
</div>
